<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Chat</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  #login { margin: auto; display: flex; flex-direction: column; gap: 8px; width: 320px; }
  input, button { padding: 6px 8px; font-size: 14px; }
  #app { display: flex; width: 100%; }
  #sidebar { width: 220px; border-right: 1px solid #ccc; padding: 8px; overflow: auto; }
  #sidebar .peer { padding: 6px; cursor: pointer; border-radius: 4px; }
  #sidebar .peer:hover { background: #eee; }
  #sidebar .peer.active { background: #d0e0ff; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #header { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; align-items: center; }
  #messages { flex: 1; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .msg { padding: 4px 8px; border-radius: 6px; max-width: 70%; white-space: pre-wrap; word-break: break-word; }
  .in { background: #eee; align-self: flex-start; }
  .out { background: #cfe7ff; align-self: flex-end; }
  #composer { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #ccc; }
  #composer input { flex: 1; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>

<div id="login">
  <h3>Подключиться к чат-серверу</h3>
  <input id="url" value="ws://localhost:8080/ws" />
  <input id="user" placeholder="username" />
  <input id="pass" type="password" placeholder="password" />
  <button id="connect-btn">Connect</button>
  <div class="hint">Если логина нет — он будет создан.</div>
</div>

<div id="app" style="display:none">
  <div id="sidebar">
    <div class="hint">Чаты:</div>
    <div id="peers"></div>
    <hr />
    <div class="hint">Начать новый чат:</div>
    <input id="new-peer" placeholder="username" />
    <button id="new-peer-btn">Open</button>
  </div>
  <div id="main">
    <div id="header">
      <span id="peer-title">—</span>
      <button id="set-pw-btn">Set shared password</button>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input id="msg" placeholder="Message…" />
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

let me = null;
let currentPeer = null;
const peers = new Set();
const msgCache = {}; // peer -> [{direction, ts, text}]

async function connect() {
  const url = document.getElementById('url').value.trim();
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pass').value;
  if (!url || !username || !password) return alert('fill all fields');
  try {
    await invoke('connect', { url, username, password });
  } catch (e) {
    alert('connect error: ' + e);
  }
}

async function openPeer(peer) {
  currentPeer = peer;
  peers.add(peer);
  const msgs = await invoke('get_messages', { peer });
  msgCache[peer] = msgs;
  document.getElementById('peer-title').textContent = peer;
  renderPeers();
  renderMessages();
}

function renderPeers() {
  const el = document.getElementById('peers');
  el.innerHTML = '';
  for (const p of peers) {
    const d = document.createElement('div');
    d.className = 'peer' + (p === currentPeer ? ' active' : '');
    d.textContent = p;
    d.onclick = () => openPeer(p);
    el.appendChild(d);
  }
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  const msgs = (msgCache[currentPeer] || []).slice().sort((a, b) => a.ts - b.ts);
  for (const m of msgs) {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.direction === 'out' ? 'out' : 'in');
    d.textContent = m.text;
    el.appendChild(d);
  }
  el.scrollTop = el.scrollHeight;
}

async function send() {
  if (!currentPeer) return;
  const input = document.getElementById('msg');
  const text = input.value;
  if (!text.trim()) return;
  try {
    await invoke('send_message', { to: currentPeer, text });
    input.value = '';
  } catch (e) {
    alert(e);
  }
}

async function setPeerPassword() {
  if (!currentPeer) return alert('open a chat first');
  const pw = prompt('Общий пароль шифрования с ' + currentPeer);
  if (pw === null) return;
  await invoke('set_peer_password', { peer: currentPeer, password: pw });
  alert('Сохранено. Внимание: старые сообщения были зашифрованы другим ключом.');
  openPeer(currentPeer);
}

async function init() {
  document.getElementById('connect-btn').onclick = connect;
  document.getElementById('send-btn').onclick = send;
  document.getElementById('set-pw-btn').onclick = setPeerPassword;
  document.getElementById('new-peer-btn').onclick = () => {
    const p = document.getElementById('new-peer').value.trim();
    if (p) openPeer(p);
  };
  document.getElementById('msg').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') send();
  });

  await listen('auth-ok', (e) => {
    me = e.payload.username;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  });

  await listen('peers', (e) => {
    for (const p of e.payload) peers.add(p);
    renderPeers();
  });

  await listen('message', (e) => {
    const m = e.payload;
    peers.add(m.peer);
    if (!msgCache[m.peer]) msgCache[m.peer] = [];
    msgCache[m.peer].push({ direction: m.direction, ts: m.ts, text: m.text });
    renderPeers();
    if (currentPeer === m.peer) renderMessages();
  });

  await listen('error', (e) => {
    console.warn('server error:', e.payload);
  });

  await listen('disconnected', () => {
    alert('Отключено от сервера.');
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
